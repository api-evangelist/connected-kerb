aid: connected-kerb
name: Connected Kerb
description: 'Connected Kerb is a UK electric-vehicle charging company that designs,
  installs, owns and operates public on-street and destination charge points, with
  a particular focus on residential drivers who have no off-street parking. Founded
  in 2017 and headquartered in London, it delivers long-term charging concessions
  for local authorities, workplaces, retail destinations, car parks and residential
  developers, and by mid-2026 operated roughly 7,800 public chargers across about
  1,780 UK locations. Its Chameleon, Gecko, Scarab and Limpet charge points are
  backed by a charge point management system, a driver mobile app, a customer portal
  for site hosts and landowners, and an OCPI roaming interface used for e-mobility
  roaming and for UK Public Charge Point Regulations 2023 open-data obligations.'
