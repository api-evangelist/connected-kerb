- id: uk-public-charge-point-regulations-2023
  name: The Public Charge Point Regulations 2023 (UK) - open charge point data
  conforms: null
  evidence: >-
    The regulations require UK public charge point operators to make charge point
    data available free of charge in a machine-readable OCPI format (Location, EVSE
    and Connector objects, OCPI 2.2.1 sections 8.3.1-8.3.3). Connected Kerb operates
    the required OCPI 2.2.1 interface, but access is token-gated and there is no
    public page, registration route or open-data landing page on any Connected Kerb
    host describing how a third party obtains that access. Presence of the interface
    is verified; free public availability of the data is not.
